name: Production Workflow Trigger Demo

on:
  push:
    branches:
      - "develop"
      - "feature/*"
      - "main" 

    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review


jobs:
  validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: print the workflow Context
        run: |
          echo "workflow Triggered as per plan"
          echo "Event type is ${{github.event_name}}"
          echo "Branch is $GITHUB_REF_NAME"
