name: Expressions 

on:
  push:
    branches:
      - main
      - feature
      - "feature/*"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - closed

env:
  APPLICATION_NAME: Learning_ghec_gh_server
  DEPLOYMENT_ENVIRONMENT: Testing

jobs:
  demo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print Event Information as per the github
        run: |
          echo "========== EVENT DETAILS =========="
          echo "Event Name: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo ""

          echo "========== BRANCH DETAILS =========="
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Ref: ${{ github.head_ref }}"
          echo ""
      
          echo "========== DEFAULT VARIABLES =========="
          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "RUNNER_OS: $RUNNER_OS"
          echo ""

          echo "========== CUSTOM VARIABLES =========="
          echo "Application Name: $APPLICATION_NAME"
          echo "Deployment Environment: $DEPLOYMENT_ENVIRONMENT"
          echo ""

          echo "========== EXPRESSIONS =========="
          echo "Is Main Branch: ${{ github.ref == 'refs/heads/main' }}"
          echo "Is Push Event: ${{ github.event_name == 'push' }}"
          echo "Is Pull Request Event: ${{ github.event_name == 'pull_request' }}"

      - name: Feature Branch Logic
        if: startsWith(github.ref_name, 'feature')
        run: |
          echo "Feature branch detected"

      - name: Main Branch Logic
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Main branch deployment logic executed"

      - name: PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          echo "Pull Request Opened"

      - name: PR Updated
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          echo "New commits pushed to PR"

      - name: PR Closed
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          echo "Pull Request Closed"
