“Hi everyone, good morning. Today I’m going to talk about GitHub Actions, specifically workflow_call and reusable workflows.

Before we start, let me give you a simple scenario. Suppose we have 20 GitHub repositories, and every repository has almost the same CI pipeline: checkout, build, test, security scan, and deploy.

If we copy the same YAML into all 20 repositories, what happens when we need to change one common step? We may have to update 20 different YAML files.

This is exactly the problem reusable workflows help us solve. Instead of duplicating the same pipeline logic everywhere, we can create the workflow once and allow other workflows to call it using workflow_call.

So in this session, we’ll understand what workflow_call is, how to create a reusable YAML workflow, how another workflow calls it, and how we pass inputs and secrets. Finally, we’ll look at a practical example.”

That introduction naturally leads into your deck’s progression from duplicated pipeline logic to workflow_call, caller workflows, and advanced patterns.

